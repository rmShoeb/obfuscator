<div class="card bg-dark border-secondary border-opacity-25 shadow-sm h-100 code-panel-card">
    <div class="card-header bg-secondary bg-opacity-10 border-secondary border-opacity-25 d-flex justify-content-between align-items-center py-2 px-3">
        <h6 class="mb-0 text-light fw-bold">{{ title() }}</h6>

        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-secondary bg-opacity-50 text-light fw-normal">{{ charCount() }} chars</span>

            <button type="button" (click)="copyCode()" class="btn btn-sm btn-outline-secondary text-light py-1 px-2 d-flex align-items-center gap-1" title="Copy to Clipboard">
                @if (copied()) {
                <i class="fa-solid fa-check text-success"></i>
                <span class="text-success small">Copied!</span>
                } @else {
                <i class="fa-regular fa-copy"></i>
                <span class="small">Copy</span>
                }
            </button>

            <button type="button" (click)="clearCode()" class="btn btn-sm btn-outline-danger py-1 px-2 d-flex align-items-center gap-1" title="Clear Editor">
                <i class="fa-regular fa-trash-can"></i>
                <span class="small">Clear</span>
            </button>
        </div>
    </div>

    <div class="card-body p-0 flex-grow-1 d-flex flex-column">
        <textarea
            class="form-control font-monospace border-0 bg-transparent text-light p-3 flex-grow-1 code-textarea"
            [(ngModel)]="code"
            [placeholder]="placeholder()"
            spellcheck="false"
        ></textarea>
    </div>
</div>
