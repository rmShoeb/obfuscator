<div class="workspace-container">
    <app-options-bar
        (optionsChange)="sqlOptions.set($event)"
        (clearAll)="onClearAll()"
    ></app-options-bar>

    <div class="split-workspace">
        <div class="panel-wrapper">
            <app-code-panel
                title="Original Code"
                placeholder="Paste or type original code here..."
                [(code)]="originalCode"
            ></app-code-panel>
        </div>

        <div class="action-column">
            <button (click)="runObfuscate()" class="btn-action btn-obfuscate">
                <div class="btn-inner">
                    <span class="action-text">Obfuscate</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </div>
            </button>

            <button (click)="runDeobfuscate()" class="btn-action btn-deobfuscate">
                <div class="btn-inner">
                    <i class="fa-solid fa-arrow-left-long"></i>
                    <span class="action-text">Deobfuscate</span>
                </div>
            </button>

            <div class="action-meta">
                <span class="meta-label">Session Mapping:</span>
                <span class="meta-val">{{ activeMappings().length }} Keys</span>
            </div>

            <button (click)="isModalOpen.set(true)" class="btn-mapping">See Mapping</button>
        </div>

        <div class="panel-wrapper">
            <app-code-panel title="Obfuscated Code"
                placeholder="Obfuscated code output will appear here. You can also paste external obfuscated code to de-obfuscate..."
                [(code)]="obfuscatedCode"
            ></app-code-panel>
        </div>
    </div>

    <!-- Mapping Dictionary Dialog Modal -->
    <app-mapping-modal
        [isOpen]="isModalOpen()"
        [mappings]="activeMappings()"
        (closeModal)="isModalOpen.set(false)"
        (triggerClearAll)="onClearAll()"
    ></app-mapping-modal>
</div>
