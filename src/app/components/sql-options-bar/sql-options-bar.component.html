<div class="options-bar shadow-sm">
    <div class="options-left">
        <!-- Dialect Selector -->
        <div class="control-group">
            <label class="control-label">
                <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
                    <ellipse cx="12" cy="5" rx="9" ry="3" />
                </svg>
                Dialect:
            </label>
            <div class="select-box">
                <select [value]="options().dialect" (change)="onDialectChange($event)" class="styled-select">
                    @for (d of dialects; track d.id) {
                    <option [value]="d.id">{{ d.name }}</option>
                    }
                </select>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Transformation Toggles -->
        <div class="toggles-group">
            <label class="checkbox-label" title="Mask string literals with STR_x placeholders">
                <input type="checkbox" [checked]="options().maskLiterals" (change)="toggleOption('maskLiterals')"
                    class="custom-checkbox" />
                <span class="checkbox-custom"></span>
                <span class="toggle-text">Literals</span>
            </label>

            <label class="checkbox-label"
                title="Mask table, column, and identifier names with tbl_x and col_x placeholders">
                <input type="checkbox" [checked]="options().maskIdentifiers" (change)="toggleOption('maskIdentifiers')"
                    class="custom-checkbox" />
                <span class="checkbox-custom"></span>
                <span class="toggle-text">Identifiers</span>
            </label>

            <label class="checkbox-label" title="Strip single-line and block comments from output">
                <input type="checkbox" [checked]="options().stripComments" (change)="toggleOption('stripComments')"
                    class="custom-checkbox" />
                <span class="checkbox-custom"></span>
                <span class="toggle-text">Strip Comments</span>
            </label>
        </div>
    </div>

    <div class="options-right">
        <!-- Global Clear All Button -->
        <button (click)="clearAll.emit()" class="btn-clear-all"
            title="Clear both code editors and in-memory token mappings">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
            Clear All
        </button>

        <!-- See Mapping Modal Trigger Button -->
        <button (click)="openMappingModal.emit()" class="btn-mapping">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6h16M4 12h16M4 18h7" />
                <circle cx="18" cy="18" r="3" />
            </svg>
            See Mapping
            @if (mappingCount() > 0) {
            <span class="mapping-badge">{{ mappingCount() }}</span>
            }
        </button>
    </div>
</div>
