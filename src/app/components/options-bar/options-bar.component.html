<div class="options-bar shadow-sm">
    <div class="options-left">
        <!-- Dialect Selector -->
        <div class="control-group">
            <label class="control-label">
                <i class="fa-solid fa-code"></i> Language:
            </label>
            <div class="select-box">
                <select [(ngModel)]="selectedOption" class="styled-select">
                    @for (option of languageOptions(); track option.id) {
                    <option [value]="option.id" [disabled]="option.disabled">{{ option.label }}</option>
                    }
                </select>
            </div>
        </div>

        <div class="divider"></div>
